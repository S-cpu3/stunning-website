<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tor Snowflake — Help Fight Censorship Around the World</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f7f7f8;color:#111;display:flex;align-items:center;justify-content:center;padding:24px;}
    .container{width:100%;max-width:680px;background:#fff;border:1px solid #e6e7ea;border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,0.06);padding:20px;box-sizing:border-box;}
    .header{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
    h1{font-size:18px;margin:0;color:#0f172a}
    p.lead{margin:0;color:#334155;font-size:14px}
    .iframe-wrap{width:100%;max-width:420px;background:#000;border-radius:8px;overflow:hidden;margin:16px 0;}
    .responsive-iframe{position:relative;width:100%;padding-top:75%;overflow:hidden}
    .responsive-iframe iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
    .caption{display:flex;flex-direction:column;gap:8px;color:#475569;font-size:13px}
    .small{color:#64748b;font-size:13px}
    .link{color:#2563eb;text-decoration:none;font-size:13px}
    @media(min-width:640px){ .header{flex-direction:row;align-items:center;justify-content:space-between} h1{font-size:20px} }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Snowflake helper">
    <div class="header">
      <h1>A Simple Website to Fight Internet Censorship</h1>
      <p class="lead">Keep this browser tab open to help people bypass censored content in their country!</p>
    </div>

    <div class="iframe-wrap" aria-hidden="false">
      <div class="responsive-iframe">
        <iframe src="https://snowflake.torproject.org/embed.html"
                width="320" height="240" frameborder="0" scrolling="no"
                title="Snowflake embed"></iframe>
      </div>
    </div>

    <div class="caption">
      <div class="small">Snowflake embed (responsive). Leaving this tab open helps provide access to censored content.</div>
      <a class="link" href="https://snowflake.torproject.org/" target="_blank" rel="noopener noreferrer">Open project</a>
    </div>
  </div>
</body>
</html>
